name: 工程验证
on:
  push:
    branches: [main, 'quality-*']
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: 检查范围
        type: choice
        options: [core, delivery]
        default: core
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      CHECK_PROFILE: ${{ (inputs.profile == 'delivery' || startsWith(github.ref_name, 'quality-delivery-')) && 'delivery' || 'core' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
      - name: 冻结安装
        run: |
          npm install --global pnpm@10.33.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: 独立测试环境
        run: pnpm test:setup
      - name: 固定模型缓存
        if: env.CHECK_PROFILE == 'delivery'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/models
          key: models-${{ runner.os }}-${{ hashFiles('workers/inference.mjs', 'workers/crop-inference.mjs', 'pnpm-lock.yaml') }}
      - name: 完整检查模型准备
        if: env.CHECK_PROFILE == 'delivery'
        run: |
          pnpm models:prepare
          pnpm models:crop-prepare
      - name: 运行检查
        run: node --import tsx tools/check-project.ts "$CHECK_PROFILE"
      - name: 生成白名单摘要
        if: always()
        run: pnpm check:report
      - name: 保存公开摘要
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/验证记录/*/公开摘要.json
            .local/验证记录/*/公开摘要.md
          retention-days: 14
          if-no-files-found: warn
      - name: 停止自建测试容器
        if: always()
        run: |
          if [ -f .local/独立测试环境.json ]; then pnpm test:stop; fi
