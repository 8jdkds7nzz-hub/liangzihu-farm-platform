<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>现场农事记录</title><link rel="stylesheet" href="/field.css"><script defer src="/field.js"></script></head><body><main><nav><a href="/records">农事记录</a> · <a href="/tasks">今日任务</a> · <a href="/login">登录</a></nav><h1>现场记农事</h1><p>首次联网登录并准备此入口后，可在本机加密保存草稿。离线保存不会改变服务器任务或告警。企业微信与真机支持范围仍待实测。</p><section id="lock"><h2>准备或解锁本机草稿</h2><label>账号<input id="account" autocomplete="username"></label><label>本机草稿PIN（至少6位；遗失后无法解密）<input id="pin" type="password" minlength="6" autocomplete="off"></label><button id="unlock">准备 / 解锁</button><p id="identity"></p></section><section id="editor" hidden><p id="connection"></p><form id="entry"><label>对象<select name="objectId" required></select></label><label>生产批次（可空，未确认时不猜测）<select name="batchId"><option value="">未关联批次</option></select></label><button type="button" id="locate">经本人同意记录现场位置</button><p id="location"></p><label>农事类型<select name="kind"><option value="inspection">巡查</option><option value="feeding">投喂</option><option value="fertilization">施肥</option><option value="irrigation">人工灌排</option><option value="harvest">采收</option><option value="other">其他</option></select></label><label>发生时间<input name="occurredAt" type="datetime-local" required></label><label>工作内容或观测<textarea name="observation" required maxlength="4000"></textarea></label><label>判断（可空）<input name="judgment"></label><label>实际动作（可空）<input name="action"></label><label>物料/产品（投喂、施肥、采收必填）<input name="material"></label><label>用量（未知留空，不自动填0）<input name="amount" type="number" min="0" step="any"></label><label>单位<input name="unit"></label><label>照片（每次最多5张，每张10MB；原片和压缩预览分别保存）<input name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><button type="submit">保存到本机</button></form><h2>本账号草稿</h2><div id="drafts"></div><button id="lockagain">锁定本机草稿</button></section><p id="message" role="status"></p></main></body></html>
