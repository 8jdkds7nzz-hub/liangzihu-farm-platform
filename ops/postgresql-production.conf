# Mount private independent NAS at /var/lib/agri-backup; verify its cluster marker first.
# Enable only on a dedicated production cluster, with matching tools and tested permissions.
wal_level = replica
archive_mode = on
archive_timeout = 300s
archive_command = 'python3 /opt/agri/wal_archive.py %p %f'
full_page_writes = on
# Continuous archive failures must trigger the external monitor; never clean pg_wal manually.
