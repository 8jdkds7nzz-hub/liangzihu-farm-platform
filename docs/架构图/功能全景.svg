<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc"><title id="title">功能全景｜六大板块，29 个工作入口</title><desc id="desc">从岗位工作找到入口；图中名称与当前界面菜单一致。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a3b6ad"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1280" height="1040" rx="20" fill="#fbfdfb"/><rect x="1" y="1" width="1278" height="1038" rx="20" fill="none" stroke="#dce7e0"/><path d="M 40 37 H 96" stroke="#24775a" stroke-width="5" stroke-linecap="round"/><text x="40" y="83" font-size="34" fill="#17352e" font-weight="700" text-anchor="start">功能全景｜六大板块，29 个工作入口</text><text x="40" y="116" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">从岗位工作找到入口；图中名称与当前界面菜单一致。</text><rect x="40" y="151" width="1200" height="62" rx="14" fill="#eaf3ed" stroke="none"/><text x="640" y="190" font-size="24" fill="#24775a" font-weight="650" text-anchor="middle">梁子湖农场工作空间 · 同一套对象、记录与授权</text><rect x="40" y="246" width="386" height="310" rx="16" fill="#fff" stroke="#dce7e0"/><rect x="58" y="264" width="45" height="38" rx="10" fill="#24775a" stroke="none"/><text x="80.5" y="291" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">01</text><text x="118" y="291" font-size="25" fill="#24775a" font-weight="650" text-anchor="start">日常工作</text><text x="404" y="324" font-size="16" fill="#596e68" font-weight="400" text-anchor="end">4 个模块</text><path d="M 62 340 H 404" stroke="#dce7e0"/><text x="62" y="372" font-size="16" fill="#24775a" font-weight="600" text-anchor="start">1.1</text><text x="105" y="372" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">工作台</text><text x="62" y="397" font-size="16" fill="#24775a" font-weight="600" text-anchor="start">1.2</text><text x="105" y="397" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">告警与核查</text><text x="62" y="422" font-size="16" fill="#24775a" font-weight="600" text-anchor="start">1.3</text><text x="105" y="422" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">任务与日历</text><text x="62" y="447" font-size="16" fill="#24775a" font-weight="600" text-anchor="start">1.4</text><text x="105" y="447" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">农事与照片</text><text x="62" y="535" font-size="16" fill="#596e68" font-weight="400" text-anchor="start">安排今天的工作，跟进现场处理</text><rect x="447" y="246" width="386" height="310" rx="16" fill="#fff" stroke="#dce7e0"/><rect x="465" y="264" width="45" height="38" rx="10" fill="#3568a6" stroke="none"/><text x="487.5" y="291" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">02</text><text x="525" y="291" font-size="25" fill="#3568a6" font-weight="650" text-anchor="start">生产业务</text><text x="811" y="324" font-size="16" fill="#596e68" font-weight="400" text-anchor="end">5 个模块</text><path d="M 469 340 H 811" stroke="#dce7e0"/><text x="469" y="372" font-size="16" fill="#3568a6" font-weight="600" text-anchor="start">2.1</text><text x="512" y="372" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">库存与批次</text><text x="469" y="397" font-size="16" fill="#3568a6" font-weight="600" text-anchor="start">2.2</text><text x="512" y="397" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">质量与溯源</text><text x="469" y="422" font-size="16" fill="#3568a6" font-weight="600" text-anchor="start">2.3</text><text x="512" y="422" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">植保作业</text><text x="469" y="447" font-size="16" fill="#3568a6" font-weight="600" text-anchor="start">2.4</text><text x="512" y="447" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">农情与影像</text><text x="469" y="472" font-size="16" fill="#3568a6" font-weight="600" text-anchor="start">2.5</text><text x="512" 