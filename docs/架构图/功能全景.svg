or="start">分析与协作</text><text x="811" y="662" font-size="16" fill="#596e68" font-weight="400" text-anchor="end">5 个模块</text><path d="M 469 678 H 811" stroke="#dce7e0"/><text x="469" y="710" font-size="16" fill="#7759a3" font-weight="600" text-anchor="start">5.1</text><text x="512" y="710" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">分析复盘</text><text x="469" y="735" font-size="16" fill="#7759a3" font-weight="600" text-anchor="start">5.2</text><text x="512" y="735" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">简报审阅</text><text x="469" y="760" font-size="16" fill="#7759a3" font-weight="600" text-anchor="start">5.3</text><text x="512" y="760" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">知识资料</text><text x="469" y="785" font-size="16" fill="#7759a3" font-weight="600" text-anchor="start">5.4</text><text x="512" y="785" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">权限内问答</text><text x="469" y="810" font-size="16" fill="#7759a3" font-weight="600" text-anchor="start">5.5</text><text x="512" y="810" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">维护与复测</text><text x="469" y="873" font-size="16" fill="#596e68" font-weight="400" text-anchor="start">从资料形成分析、审阅与任务草稿</text><rect x="854" y="584" width="386" height="310" rx="16" fill="#fff" stroke="#dce7e0"/><rect x="872" y="602" width="45" height="38" rx="10" fill="#657369" stroke="none"/><text x="894.5" y="629" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">06</text><text x="932" y="629" font-size="25" fill="#657369" font-weight="650" text-anchor="start">管理</text><text x="1218" y="662" font-size="16" fill="#596e68" font-weight="400" text-anchor="end">4 个模块</text><path d="M 876 678 H 1218" stroke="#dce7e0"/><text x="876" y="710" font-size="16" fill="#657369" font-weight="600" text-anchor="start">6.1</text><text x="919" y="710" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">规则审核</text><text x="876" y="735" font-size="16" fill="#657369" font-weight="600" text-anchor="start">6.2</text><text x="919" y="735" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">值班安排</text><text x="876" y="760" font-size="16" fill="#657369" font-weight="600" text-anchor="start">6.3</text><text x="919" y="760" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">配置管理</text><text x="876" y="785" font-size="16" fill="#657369" font-weight="600" text-anchor="start">6.4</text><text x="919" y="785" font-size="21" fill="#17352e" font-weight="400" text-anchor="start">运行与费用</text><text x="876" y="873" font-size="16" fill="#596e68" font-weight="400" text-anchor="start">维护规则、岗位、配置与运行条件</text><rect x="40" y="924" width="1200" height="90" rx="16" fill="#f1f5f2" stroke="none"/><text x="66" y="958" font-size="18" fill="#596e68" font-weight="600" text-anchor="start">贯穿各板块的对象</text><text x="66" y="991" font-size="23" fill="#17352e" font-weight="600" text-anchor="start">场区  /  塘口  /  地块  /  设备与测点  /  生产批次</text><text x="1212" y="958" font-size="17" fill="#596e68" font-weight="400" text-anchor="end">功能分类图 · 无业务先后关系</text></g></svg>