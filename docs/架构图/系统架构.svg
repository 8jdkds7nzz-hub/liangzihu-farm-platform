<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1090" viewBox="0 0 1280 1090" role="img" aria-labelledby="title desc"><title id="title">系统架构｜两类终端，共用业务与数据</title><desc id="desc">人员使用界面；设备提供资料；后台任务独立运行并共用数据库与私有文件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a3b6ad"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1280" height="1090" rx="20" fill="#fbfdfb"/><rect x="1" y="1" width="1278" height="1088" rx="20" fill="none" stroke="#dce7e0"/><path d="M 40 37 H 96" stroke="#24775a" stroke-width="5" stroke-linecap="round"/><text x="40" y="83" font-size="34" fill="#17352e" font-weight="700" text-anchor="start">系统架构｜两类终端，共用业务与数据</text><text x="40" y="116" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">人员使用界面；设备提供资料；后台任务独立运行并共用数据库与私有文件。</text><rect x="32" y="284" width="524" height="353" rx="18" fill="#eef5fb" stroke="#c7d9eb"/><text x="56" y="311" font-size="17" fill="#3568a6" font-weight="600" text-anchor="start">同一个 Next.js 工程</text><path d="M 292 254 V 329" fill="none" stroke="#a3b6ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="310" y="294" font-size="17" fill="#596e68" font-weight="400" text-anchor="start">页面操作</text><path d="M 980 254 V 329" fill="none" stroke="#a3b6ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="998" y="294" font-size="17" fill="#596e68" font-weight="400" text-anchor="start">测值 / 影像 / 作业文件</text><path d="M 292 429 V 483" fill="none" stroke="#a3b6ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="310" y="464" font-size="17" fill="#596e68" font-weight="400" text-anchor="start">/api/v1 接口</text><path d="M 980 429 V 483" fill="none" stroke="#a3b6ad" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="998" y="464" font-size="17" fill="#a16d25" font-weight="400" text-anchor="start">真实账户与样本待联调</text><path d="M 720 541 H 540" fill="none" stroke="#a3b6ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="630" y="527" font-size="17" fill="#596e68" font-weight="400" text-anchor="middle">标准化记录</text><text x="56" y="665" font-size="18" fill="#596e68" font-weight="400" text-anchor="start">后台任务独立运行，通过数据库领取任务</text><path d="M 292 800 V 876" fill="none" stroke="#a3b6ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="310" y="843" font-size="17" fill="#596e68" font-weight="400" text-anchor="start">任务领取与结果记录</text><path d="M 40 570 H 16 V 929 H 40" fill="none" stroke="#a3b6ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="40" y="843" font-size="16" fill="#596e68" font-weight="400" text-anchor="start">业务读写 / 任务入队</text><path d="M 540 584 H 650 V 921 H 720" fill="none" stroke="#a3b6ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="667" y="655" font-size="17" fill="#596e68" font-weight="400" text-anchor="start">原件读写</text><path d="M 540 747 H 598 V 969 H 720" fill="none" stroke="#a3b6ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="610" y="823" font-size="17" fill="#596e68" font-weight="400" text-anchor="start">派生成果</text><rect x="40" y="153" width="500" height="101" rx="16" fill="#fff" stroke="#dce7e0"/><rect x="40" y="171" width="4" height="65" rx="2" fill="#3568a6"/><text x="64" y="192" font-size="24" fill="#3568a6" font-weight="650" text-anchor="start">人员终端</text><text x="64" y="223" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">电脑、手机浏览器 · 现场离线草稿</text><rect x="720" y="153" width="520" height="101" rx="16" fill="#fff" stroke="#dce7e0"/><rect x="720" y="171" width="4" height="65" rx="2" fill="#a16d25"/><text x="744" y="192" font-size="24" fill="#a16d25" font-weight="650" text-anchor="start">现场设备终端</text><text x="744" y="223" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">传感器、摄像头、无人机、机场、机具</text><rect x="1085" y="169" width="132" height="28" rx="14" fill="#fff" stroke="#a16d25"/><text x="1151" y="189" font-size="16" fill="#a16d25" font-weight="600" text-anchor="middle">待真实联调</text><rect x="40" y="329" width="500" height="100" rx="16" fill="#fff" stroke="#dce7e0"/><rect x="40" y="347" width="4" height="64" rx="2" fill="#3568a6"/><text x="64" y="368" font-size="24" fill="#3568a6" font-weight="650" text-anchor="start">前端界面</text><text x="64" y="399" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">React / TypeScript · 页面、表单与空间视图</text><rect x="720" y="329" width="520" height="100" rx="16" fill="#fff" stroke="#dce7e0"/><rect x="720" y="347" width="4" height="64" rx="2" fill="#a16d25"/><text x="744" y="368" font-size="24" fill="#a16d25" font-weight="650" text-anchor="start">厂家平台与资料入口</text><text x="744" y="399" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">授权接口 / 标准文件 / 人工登记</text><rect x="40" y="483" width="500" height="130" rx="16" fill="#fff" stroke="#dce7e0"/><rect x="40" y="501" width="4" height="94" rx="2" fill="#24775a"/><text x="64" y="522" font-size="24" fill="#24775a" font-weight="650" text-anchor="start">后端业务服务</text><text x="64" y="553" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">身份与对象授权 · 校验、版本与业务状态</text><text x="64" y="582" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">控制准备只登记申请、条件与反馈</text><rect x="720" y="483" width="520" height="130" rx="16" fill="#fff" stroke="#dce7e0"/><rect x="720" y="501" width="4" height="94" rx="2" fill="#24775a"/><text x="744" y="522" font-size="24" fill="#24775a" font-weight="650" text-anchor="start">接入程序</text><text x="744" y="553" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">取数、转换、去重、核验</text><text x="744" y="582" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">只读采集软件已有，实装接入另行验收</text><rect x="40" y="690" width="500" height="110" rx="16" fill="#fff" stroke="#dce7e0"/><rect x="40" y="708" width="4" height="74" rx="2" fill="#7759a3"/><text x="64" y="729" font-size="24" fill="#7759a3" font-weight="650" text-anchor="start">独立后台任务</text><text x="64" y="760" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">告警、媒体、模型、地形、农情与报告</text><rect x="720" y="690" width="520" height="110" rx="16" fill="#fff4ee" stroke="#edcfc2"/><text x="745" y="727" font-size="23" fill="#a75045" font-weight="650" text-anchor="start">真实执行适配器：尚未实现</text><text x="745" y="761" font-size="18" fill="#a75045" font-weight="400" text-anchor="start">G15 待开发与联合测试；当前不下发设备动作</text><rect x="40" y="876" width="500" height="135" rx="16" fill="#edf5ef" stroke="#dce7e0"/><rect x="40" y="894" width="4" height="99" rx="2" fill="#24775a"/><text x="64" y="915" font-size="24" fill="#24775a" font-weight="650" text-anchor="start">数据库</text><text x="64" y="946" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">PostgreSQL / PostGIS / pgvector</text><text x="64" y="975" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">业务与空间记录、授权、索引和任务队列</text><rect x="720" y="876" width="520" height="135" rx="16" fill="#edf5ef" stroke="#dce7e0"/><rect x="720" y="894" width="4" height="99" rx="2" fill="#24775a"/><text x="744" y="915" font-size="24" fill="#24775a" font-weight="650" text-anchor="start">私有文件存储</text><text x="744" y="946" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">本地 / S3 · 原件、预览、模型与派生成果</text><text x="744" y="975" font-size="19" fill="#596e68" font-weight="400" text-anchor="start">API 与后台任务分别按当前授权读写</text><text x="40" y="1053" font-size="18" fill="#596e68" font-weight="400" text-anchor="start">实线：已有软件的数据路径     虚线：真实来源待联调     红色提示：未实现的设备执行能力</text></g></svg>